<svg xmlns="http://www.w3.org/2000/svg" width="664" height="498" viewBox="0 0 664 498"><rect width="100%" height="100%" rx="8" fill="#0d1117" stroke="#30363d"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><text x="18" y="31" xml:space="preserve"><tspan fill="#e6edf3">$ fitr role review daily-driver</tspan></text><text x="18" y="50" xml:space="preserve"></text><text x="18" y="69" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff" font-weight="bold">fitr / role review</tspan></text><text x="18" y="88" xml:space="preserve"><tspan fill="#e6edf3">  daily-driver</tspan></text><text x="18" y="107" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#d29922">SINGLE-QUALIFIED</tspan></text><text x="18" y="126" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">----------------------------------------------------------------------------</tspan></text><text x="18" y="145" xml:space="preserve"></text><text x="18" y="164" xml:space="preserve"><tspan fill="#e6edf3">  01 daily-model:q5</tspan></text><text x="18" y="183" xml:space="preserve"><tspan fill="#e6edf3">  state       </tspan><tspan fill="#3fb950">ELIGIBLE</tspan></text><text x="18" y="202" xml:space="preserve"><tspan fill="#e6edf3">              quality: established</tspan></text><text x="18" y="221" xml:space="preserve"><tspan fill="#e6edf3">              context: established</tspan></text><text x="18" y="240" xml:space="preserve"><tspan fill="#e6edf3">              memory: established</tspan></text><text x="18" y="259" xml:space="preserve"></text><text x="18" y="278" xml:space="preserve"><tspan fill="#e6edf3">  02 tiny-model:q4</tspan></text><text x="18" y="297" xml:space="preserve"><tspan fill="#e6edf3">  state       </tspan><tspan fill="#f85149">INELIGIBLE</tspan></text><text x="18" y="316" xml:space="preserve"><tspan fill="#e6edf3">  gap         quality: independent output checks did not clear the required rate</tspan></text><text x="18" y="335" xml:space="preserve"><tspan fill="#e6edf3">  gap         Fitting memory and generating quickly do not establish useful</tspan></text><text x="18" y="354" xml:space="preserve"><tspan fill="#e6edf3">              work.</tspan></text><text x="18" y="373" xml:space="preserve"></text><text x="18" y="392" xml:space="preserve"><tspan fill="#e6edf3">  next        One candidate clears the declared screening floors. Test the full</tspan></text><text x="18" y="411" xml:space="preserve"><tspan fill="#e6edf3">              workflow before granting agentic authority.</tspan></text><text x="18" y="430" xml:space="preserve"></text><text x="18" y="449" xml:space="preserve"><tspan fill="#e6edf3">  Battery screening only. Preference bounds are not a joint confidence interval.</tspan></text><text x="18" y="468" xml:space="preserve"><tspan fill="#e6edf3">  No automatic adoption.</tspan></text></g></svg>