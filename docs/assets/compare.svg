<svg xmlns="http://www.w3.org/2000/svg" width="876" height="346" viewBox="0 0 876 346"><rect width="100%" height="100%" rx="8" fill="#0d1117" stroke="#30363d"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><text x="18" y="31" xml:space="preserve"><tspan fill="#e6edf3">$ fitr compare qwen3-coder:30b llama3.1:8b</tspan></text><text x="18" y="50" xml:space="preserve"></text><text x="18" y="69" xml:space="preserve"><tspan fill="#e6edf3">  qwen3-coder:30b  vs  llama3.1:8b</tspan></text><text x="18" y="88" xml:space="preserve"></text><text x="18" y="107" xml:space="preserve"><tspan fill="#e6edf3">  decode tok/s              23.16 vs    14.61   1.58x [1.47 .. 1.71]  first is faster</tspan></text><text x="18" y="126" xml:space="preserve"><tspan fill="#e6edf3">  prefill tok/s            226.64 vs   148.20   1.53x [1.44 .. 1.63]  first is faster</tspan></text><text x="18" y="145" xml:space="preserve"></text><text x="18" y="164" xml:space="preserve"><tspan fill="#e6edf3">  coding                 11/11 vs 9/11   diff +0.18 [-0.11 .. +0.48]  ~ cannot separate</tspan></text><text x="18" y="183" xml:space="preserve"><tspan fill="#e6edf3">  structured_output      5/7 vs 0/7   diff +0.71 [+0.21 .. +0.92]  first is better here</tspan></text><text x="18" y="202" xml:space="preserve"><tspan fill="#e6edf3">  instruction_precision  4/4 vs 0/4   diff +1.00 [+0.31 .. +1.00]  first is better here</tspan></text><text x="18" y="221" xml:space="preserve"></text><text x="18" y="240" xml:space="preserve"><tspan fill="#e6edf3">  paired on 16 identical instances: qwen3-coder:30b alone passed 9, llama3.1:8b alone passed 0, agreed on 7</tspan></text><text x="18" y="259" xml:space="preserve"><tspan fill="#e6edf3">  qwen3-coder:30b wins the flips (McNemar exact p=0.004, mid-p 0.002)</tspan></text><text x="18" y="278" xml:space="preserve"></text><text x="18" y="297" xml:space="preserve"><tspan fill="#e6edf3">  note  a difference is claimed only when its 95% interval excludes zero;</tspan></text><text x="18" y="316" xml:space="preserve"><tspan fill="#e6edf3">        "cannot separate" is a real answer, not a missing one.</tspan></text></g></svg>