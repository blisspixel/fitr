<svg xmlns="http://www.w3.org/2000/svg" width="648" height="289" viewBox="0 0 648 289"><rect width="100%" height="100%" rx="8" fill="#0d1117" stroke="#30363d"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><text x="18" y="31" xml:space="preserve"><tspan fill="#e6edf3">$ fitr apply qwen3:30b</tspan></text><text x="18" y="50" xml:space="preserve"></text><text x="18" y="69" xml:space="preserve"><tspan fill="#e6edf3">  apply prints how to persist a measured context.</tspan></text><text x="18" y="88" xml:space="preserve"><tspan fill="#e6edf3">  fitr does not restart or mutate the serving process.</tspan></text><text x="18" y="107" xml:space="preserve"></text><text x="18" y="126" xml:space="preserve"><tspan fill="#e6edf3">  model          qwen3:30b</tspan></text><text x="18" y="145" xml:space="preserve"><tspan fill="#e6edf3">  ctx            4096</tspan></text><text x="18" y="164" xml:space="preserve"><tspan fill="#e6edf3">  runtime        ollama</tspan></text><text x="18" y="183" xml:space="preserve"></text><text x="18" y="202" xml:space="preserve"><tspan fill="#e6edf3">    per-request: already what `fitr run --ctx 4096` sends as options.num_ctx</tspan></text><text x="18" y="221" xml:space="preserve"><tspan fill="#e6edf3">    persist a derived tag: write a Modelfile with FROM qwen3:30b and PARAMETER</tspan></text><text x="18" y="240" xml:space="preserve"><tspan fill="#e6edf3">    num_ctx 4096</tspan></text><text x="18" y="259" xml:space="preserve"><tspan fill="#e6edf3">    then: ollama create qwen3:30b-ctx4096 -f Modelfile</tspan></text></g></svg>