<svg xmlns="http://www.w3.org/2000/svg" width="664" height="574" viewBox="0 0 664 574"><rect width="100%" height="100%" rx="8" fill="#0d1117" stroke="#30363d"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><text x="18" y="31" xml:space="preserve"><tspan fill="#e6edf3">$ fitr</tspan></text><text x="18" y="50" xml:space="preserve"></text><text x="18" y="69" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff" font-weight="bold">fitr 0.9.10</tspan></text><text x="18" y="88" xml:space="preserve"><tspan fill="#e6edf3">  cpu       AMD Ryzen 7 7840U (16 logical)</tspan></text><text x="18" y="107" xml:space="preserve"><tspan fill="#e6edf3">  gpu       AMD Radeon 780M (rocm)</tspan></text><text x="18" y="126" xml:space="preserve"><tspan fill="#e6edf3">  memory    32.0 (unified memory (system RAM))</tspan></text><text x="18" y="145" xml:space="preserve"><tspan fill="#e6edf3">  runtime   ollama http://127.0.0.1:11434</tspan></text><text x="18" y="164" xml:space="preserve"><tspan fill="#e6edf3">  profile   </tspan><tspan fill="#8b949e">lappy</tspan></text><text x="18" y="183" xml:space="preserve"><tspan fill="#e6edf3">warning     </tspan><tspan fill="#d29922">32.0 GB is addressable shared capacity, not a safe model budget;</tspan></text><text x="18" y="202" xml:space="preserve"><tspan fill="#e6edf3">            </tspan><tspan fill="#d29922">pass --vram-gb N</tspan></text><text x="18" y="221" xml:space="preserve"></text><text x="18" y="240" xml:space="preserve"><tspan fill="#e6edf3">  MODEL                      STATE            CTX      SIZE  NEXT</tspan></text><text x="18" y="259" xml:space="preserve"><tspan fill="#e6edf3">  * qwen3:30b-q4             </tspan><tspan fill="#3fb950">measured        </tspan><tspan fill="#e6edf3"> 16k/8k 18.0 GB  apply</tspan></text><text x="18" y="278" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">measured ctx=16384; serving ctx=8192</tspan></text><text x="18" y="297" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">2k ok | 4k ok | 8k ok | *16k ok | &gt;32k no</tspan></text><text x="18" y="316" xml:space="preserve"><tspan fill="#e6edf3">  gemma4:12b                 </tspan><tspan fill="#8b949e">unproven        </tspan><tspan fill="#e6edf3"> -      8.0 GB  advise</tspan></text><text x="18" y="335" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">shared-memory fit needs a safe operator budget or an exact runtime receipt</tspan></text><text x="18" y="354" xml:space="preserve"><tspan fill="#e6edf3">  qwen3:32b                  </tspan><tspan fill="#d29922">stale           </tspan><tspan fill="#e6edf3"> -     20.0 GB  run</tspan></text><text x="18" y="373" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">device or runtime changed since the last measurement</tspan></text><text x="18" y="392" xml:space="preserve"><tspan fill="#e6edf3">  llama3.1:70b               </tspan><tspan fill="#8b949e">unproven        </tspan><tspan fill="#e6edf3"> -     40.0 GB  advise</tspan></text><text x="18" y="411" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">addressable system RAM is not a safe budget; mmap and runtime allocation are</tspan></text><text x="18" y="430" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">unmeasured</tspan></text><text x="18" y="449" xml:space="preserve"></text><text x="18" y="468" xml:space="preserve"><tspan fill="#8b949e">  next reads as `fitr &lt;next&gt; &lt;model&gt;`, e.g. fitr advise qwen3:30b-q4</tspan></text><text x="18" y="487" xml:space="preserve"><tspan fill="#8b949e">  * loaded    CTX is measured, or measured/serving when they differ</tspan></text><text x="18" y="506" xml:space="preserve"><tspan fill="#8b949e">  * suggested window   &gt; requested window that does not fit</tspan></text><text x="18" y="525" xml:space="preserve"><tspan fill="#8b949e">  unmeasured is a candidate, never a recommendation</tspan></text><text x="18" y="544" xml:space="preserve"><tspan fill="#8b949e">  board compares only measured runs</tspan></text></g></svg>