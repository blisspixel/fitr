<svg xmlns="http://www.w3.org/2000/svg" width="664" height="479" viewBox="0 0 664 479"><rect width="100%" height="100%" rx="8" fill="#0d1117" stroke="#30363d"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><text x="18" y="31" xml:space="preserve"><tspan fill="#e6edf3">$ fitr</tspan></text><text x="18" y="50" xml:space="preserve"></text><text x="18" y="69" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff" font-weight="bold">fitr 0.10.4</tspan></text><text x="18" y="88" xml:space="preserve"><tspan fill="#e6edf3">  cpu       AMD Ryzen 9 5950X 16-Core Processor (32 logical)</tspan></text><text x="18" y="107" xml:space="preserve"><tspan fill="#e6edf3">  gpu       NVIDIA GeForce RTX 4090 (cuda)</tspan></text><text x="18" y="126" xml:space="preserve"><tspan fill="#e6edf3">  memory    24.0 (nvidia-smi)</tspan></text><text x="18" y="145" xml:space="preserve"><tspan fill="#e6edf3">  runtime   ollama http://127.0.0.1:11434</tspan></text><text x="18" y="164" xml:space="preserve"><tspan fill="#e6edf3">  profile   </tspan><tspan fill="#d29922">default · UNCALIBRATED</tspan></text><text x="18" y="183" xml:space="preserve"></text><text x="18" y="202" xml:space="preserve"><tspan fill="#e6edf3">  MODEL                      STATE            EVID     SIZE  NEXT</tspan></text><text x="18" y="221" xml:space="preserve"><tspan fill="#e6edf3">  qwen3-coder:30b            </tspan><tspan fill="#3fb950">measured        </tspan><tspan fill="#e6edf3"> 8k    17.3 GB  view</tspan></text><text x="18" y="240" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">projected windows: 2k ok | 4k ok | *8k ok | 16k ok | 32k ok | 256k no</tspan></text><text x="18" y="259" xml:space="preserve"><tspan fill="#e6edf3">  devstral-small-2:24b       </tspan><tspan fill="#8b949e">unproven        </tspan><tspan fill="#e6edf3"> -     14.1 GB  advise</tspan></text><text x="18" y="278" xml:space="preserve"><tspan fill="#e6edf3">  qwen3.5:27b                </tspan><tspan fill="#8b949e">unproven        </tspan><tspan fill="#e6edf3"> -     16.2 GB  advise</tspan></text><text x="18" y="297" xml:space="preserve"><tspan fill="#e6edf3">  llama3:70b                 </tspan><tspan fill="#f85149">incompatible    </tspan><tspan fill="#e6edf3"> -     37.2 GB  try a smaller quant</tspan></text><text x="18" y="316" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">weights 37.2 GB exceed 24.0 GB (nvidia-smi)</tspan></text><text x="18" y="335" xml:space="preserve"></text><text x="18" y="354" xml:space="preserve"><tspan fill="#8b949e">  next reads as `fitr &lt;next&gt; &lt;model&gt;`, e.g. fitr advise qwen3-coder:30b</tspan></text><text x="18" y="373" xml:space="preserve"><tspan fill="#8b949e">  [L] loaded model    EVID is measured/serving, not artifact max</tspan></text><text x="18" y="392" xml:space="preserve"><tspan fill="#8b949e">  * suggested window   &gt; requested window that does not fit</tspan></text><text x="18" y="411" xml:space="preserve"><tspan fill="#8b949e">  projected windows derive from weights, KV, and the stated memory budget</tspan></text><text x="18" y="430" xml:space="preserve"><tspan fill="#8b949e">  unmeasured is a candidate, never a recommendation</tspan></text><text x="18" y="449" xml:space="preserve"><tspan fill="#8b949e">  board compares only measured runs</tspan></text></g></svg>