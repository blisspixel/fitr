<svg xmlns="http://www.w3.org/2000/svg" width="648" height="384" viewBox="0 0 648 384"><rect width="100%" height="100%" rx="8" fill="#0d1117" stroke="#30363d"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><text x="18" y="31" xml:space="preserve"><tspan fill="#e6edf3">$ fitr doctor qwen3-coder:30b</tspan></text><text x="18" y="50" xml:space="preserve"></text><text x="18" y="69" xml:space="preserve"><tspan fill="#e6edf3">doctor: qwen3-coder:30b on AMD Radeon(TM) 780M (0.32.14)</tspan></text><text x="18" y="88" xml:space="preserve"><tspan fill="#e6edf3">  [</tspan><tspan fill="#3fb950">PASS</tspan><tspan fill="#e6edf3">] real_token         generated 2 token(s), TTFT 0.91s, load 8.2s</tspan></text><text x="18" y="107" xml:space="preserve"><tspan fill="#e6edf3">  [</tspan><tspan fill="#3fb950">PASS</tspan><tspan fill="#e6edf3">] placement          GPU 100%</tspan></text><text x="18" y="126" xml:space="preserve"><tspan fill="#e6edf3">  [</tspan><tspan fill="#3fb950">PASS</tspan><tspan fill="#e6edf3">] served_context     ~2.8k-token prompt evaluated as 2736 tokens</tspan></text><text x="18" y="145" xml:space="preserve"><tspan fill="#e6edf3">  [</tspan><tspan fill="#3fb950">PASS</tspan><tspan fill="#e6edf3">] determinism_text  </tspan></text><text x="18" y="164" xml:space="preserve"><tspan fill="#e6edf3">         5/5 runs byte-identical - greedy decoding reproduces on this stack</tspan></text><text x="18" y="183" xml:space="preserve"><tspan fill="#e6edf3">         (bounds divergence &lt;45% at 95% CL; raise -n to tighten)</tspan></text><text x="18" y="202" xml:space="preserve"><tspan fill="#e6edf3">  [</tspan><tspan fill="#d29922">WARN</tspan><tspan fill="#e6edf3">] determinism_json  </tspan></text><text x="18" y="221" xml:space="preserve"><tspan fill="#e6edf3">         3 distinct output(s) across 5 identical requests (first divergence at</tspan></text><text x="18" y="240" xml:space="preserve"><tspan fill="#e6edf3">         byte 214) - plain text reproduces but JSON mode does not: the</tspan></text><text x="18" y="259" xml:space="preserve"><tspan fill="#e6edf3">         constrained decoding path is the culprit (a known local-stack bug</tspan></text><text x="18" y="278" xml:space="preserve"><tspan fill="#e6edf3">         class); prefer prompt-level JSON when you need repeatability</tspan></text><text x="18" y="297" xml:space="preserve"><tspan fill="#e6edf3">  [</tspan><tspan fill="#d29922">WARN</tspan><tspan fill="#e6edf3">] config            </tspan></text><text x="18" y="316" xml:space="preserve"><tspan fill="#e6edf3">         OLLAMA_MAX_LOADED_MODELS=2 allows a second resident model to</tspan></text><text x="18" y="335" xml:space="preserve"><tspan fill="#e6edf3">         contaminate timings</tspan></text><text x="18" y="354" xml:space="preserve"><tspan fill="#e6edf3">  =&gt;     measurable, with 2 caveat(s) worth knowing before trusting numbers</tspan></text></g></svg>