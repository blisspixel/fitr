# Static analysis gate.
#
# Everything enabled here passes on the whole tree, so this is a hard gate and
# a red build means a real regression. A gate that ships red is a gate people
# learn to ignore.
#
# Deliberately deferred, each with a reason rather than a shrug:
#   recvcheck - five types mix value and pointer receivers. Correcting that
#     changes value semantics on types that are copied deliberately, which is a
#     considered change, not a lint sweep.
#   unparam - the cmdX(ctx, args) dispatch signature is uniform on purpose, so
#     several commands legitimately ignore ctx.
#   errname - Failure and FileWarning are domain nouns used across the evidence
#     contract; renaming them to XxxError would churn the API to satisfy a
#     naming convention.
#   nilnil - the optional-budget readers return (nil, nil) for "the operator did
#     not supply this", which is the answer the caller wants. A sentinel error
#     would make every caller handle a condition that is not a failure, and
#     absent-is-legitimate is a rule this project holds everywhere else.
#   canonicalheader - the two findings read headers through http.Header.Get,
#     which canonicalizes its argument, so both spellings already resolve to the
#     same key. It is a naming preference here, not a correctness gate.
#   dupword - fires on usage text and a test token where the repetition is the
#     content, not a typo.
#   exhaustive - most switches here accumulate rather than decide: an event type
#     that adds no duration, or a requirement state that does not change the
#     aggregate, contributes nothing by construction. Enabling it would add
#     empty cases that state the obvious. Where a fall-through decides values
#     rather than skipping them, the case is written out deliberately; see the
#     unified-memory branch in internal/role/confirmation_capacity.go.
#   gosec - evaluated against the whole tree rather than assumed. Its findings
#     here are the 0700 modes this project sets on purpose, compared against a
#     file threshold; the device and runtime probes it is supposed to run; the
#     Windows syscall bindings that need unsafe; deterministic seeding, which is
#     a reproducibility requirement rather than a weak random; and operator-named
#     paths reaching the file API, which is the feature. The one real finding, a
#     digest used as a map key, was fixed in the code instead. A gate that needs
#     five standing exclusions to pass is not a gate.
version: "2"

run:
  timeout: 10m

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/blisspixel/fitr

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    # Correctness.
    - asasalint # []any passed to a variadic any
    - bidichk # bidirectional unicode that hides code
    - bodyclose # unclosed HTTP bodies in the backend clients
    - durationcheck # duration multiplied by a duration
    - errorlint # %v where %w is needed; == where errors.Is is needed
    - fatcontext # a context created or nested inside a loop
    - forcetypeassert # an unchecked assertion panics instead of reporting
    - gocheckcompilerdirectives # a //go: directive that the compiler ignores
    - makezero # append to a non-zero-length slice
    - nilerr # returns nil after checking err != nil
    - nilnesserr # returns a nil error where a non-nil one was checked
    - noctx # HTTP request built without a context
    - reassign # package-level variable reassigned

    # Idiom.
    - exptostd # a golang.org/x helper the standard library now provides
    - gocritic
    - goprintffuncname # a printf-style helper whose name hides that it is one
    - intrange
    - iotamixing # explicit values mixed into an iota block
    - mirror # a []byte conversion where a string-native call exists
    - nakedret
    - perfsprint
    - predeclared # shadowing len, cap, new
    - unconvert
    - usestdlibvars
    - wastedassign
    - whitespace

    # Tests.
    - thelper # helpers that never call t.Helper()
    - usetesting # t.TempDir / t.Setenv over hand-rolled equivalents

    # Hygiene.
    - dupl # duplicated production logic drifts and weakens evidence contracts
    - gocyclo # keep every control-flow unit within the project threshold
    - funlen # keep functions and tests small enough to audit locally
    - gocognit # bound cognitive complexity, including test harnesses
    - misspell # a misspelling in a diagnostic is a diagnostic nobody can grep
    - nestif # keep nested decision paths explicit and reviewable
    - nolintlint

  settings:
    gocyclo:
      min-complexity: 30

    errcheck:
      check-type-assertions: true
      # Writing to stdout/stderr and closing a file opened for reading cannot
      # meaningfully fail, and handling them adds noise without adding safety.
      # A writer's Close is NOT in this list: it flushes, so it can lose data.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - (io.Closer).Close
        - os.Setenv
        - os.Unsetenv
        - os.RemoveAll

    govet:
      enable-all: true
      disable:
        - fieldalignment # churn without a measurable win here
        - shadow # very noisy in error-heavy Go

    gocritic:
      # diagnostic and performance only. The style tag is largely taste
      # (unnamedResult, paramTypeCombine, singleCaseSwitch) and enabling it
      # today would mean rewriting working code to satisfy a preference.
      enabled-tags: [diagnostic, performance]
      disabled-checks:
        - hugeParam # fires on deliberate value receivers
        - rangeValCopy
        - ifElseChain # an explicit chain is clearer than a bare switch here
        - singleCaseSwitch # a one-case switch documents room to grow

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    warn-unused: true
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Tests legitimately duplicate setup and ignore errors on teardown, and a
      # failed assertion in a test is a reported failure rather than a silent
      # wrong value, which is the case forcetypeassert exists to prevent.
      - path: '_test\.go'
        linters: [errcheck, unparam, gocritic, noctx, forcetypeassert]
