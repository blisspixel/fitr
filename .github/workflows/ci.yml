name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.0' }
      # No Ollama needed: every test here is pure logic. The tests that would
      # need a model are the ones you run locally against your own hardware.
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: race detector
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1
      - run: go build ./...
      - name: README screenshot drift
        if: runner.os == 'Linux'
        run: |
          go run ./cmd/fitr screenshots docs/assets
          git diff --exit-code -- docs/assets
      - name: installer syntax
        if: runner.os == 'Linux'
        run: sh -n install.sh
      - name: installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: installer failure stays in the PowerShell host
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FITR_BIN: ${{ runner.temp }}\fitr-failure-scope
          FITR_RELEASE_BASE_URL: http://127.0.0.1:1
          FITR_REQUIRE_BINARY: '1'
        run: |
          $preferenceBefore = $ErrorActionPreference
          $caught = $false
          try {
            Invoke-Expression (Get-Content .\install.ps1 -Raw)
          } catch {
            $caught = $true
            if (-not $_.Exception.Message.Contains("could not fetch the required release binary")) {
              throw
            }
          }
          if (-not $caught) { throw "installer failure was not a terminating exception" }
          if ($ErrorActionPreference -ne $preferenceBefore) {
            throw "installer changed caller ErrorActionPreference from $preferenceBefore to $ErrorActionPreference"
          }
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.0' }
      - run: make dist
      - name: reproducible Linux binary
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "${RUNNER_TEMP}/fitr-linux-amd64" ./cmd/fitr
          cmp dist/fitr-linux-amd64 "${RUNNER_TEMP}/fitr-linux-amd64"
      - name: static Linux binary
        shell: bash
        run: |
          if readelf -l dist/fitr-linux-amd64 | grep -q 'Requesting program interpreter'; then
            echo "Linux release binary has a dynamic loader" >&2
            exit 1
          fi
      - name: binary CLI contract
        shell: bash
        run: |
          ./dist/fitr-linux-amd64 --help >/dev/null 2>&1
          ./dist/fitr-linux-amd64 run --help >/dev/null 2>&1
          set +e
          diagnostic="$(./dist/fitr-linux-amd64 device unexpected 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "hint: fitr device" <<<"$diagnostic"
      - name: binary size gate
        shell: bash
        run: |
          # The context task pack is reachable from record evidence validation,
          # so its generator and verifier are linked rather than eliminated.
          # That is 127 KiB across every target. Measured 15,239,680 bytes on
          # windows/amd64; all six targets retain this measured cap.
          max_bytes=15290000
          for binary in dist/fitr-*; do
            size="$(stat -c %s "$binary")"
            printf '%-32s %10d bytes\n' "$binary" "$size"
            test "$size" -le "$max_bytes"
          done
      - name: checksums
        run: make dist-checksums
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: dist/

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.0' }
      - name: repository coverage gate
        run: sh scripts/check-coverage.sh 80

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.25.14' }
      - run: go test ./... -count=1

  mcp-sdk:
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.0' }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14.7' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist
      - name: install locked test-only SDK
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/fitr-mcp-sdk"
          sdk_python="$RUNNER_TEMP/fitr-mcp-sdk/bin/python"
          if [ "$RUNNER_OS" = "Windows" ]; then
            sdk_python="$RUNNER_TEMP/fitr-mcp-sdk/Scripts/python.exe"
          fi
          "$sdk_python" -I -m pip install --require-hashes -r scripts/mcp-sdk-requirements.txt
          "$sdk_python" -I -m pip check
          printf 'MCP_SDK_PYTHON=%s\n' "$sdk_python" >> "$GITHUB_ENV"
      - name: official SDK accepts actual candidate binary
        shell: bash
        run: |
          binary="$(pwd)/dist/fitr-$(go env GOOS)-$(go env GOARCH)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            binary="$binary.exe"
          fi
          chmod +x "$binary"
          "$MCP_SDK_PYTHON" -I -B -m unittest discover -s scripts -p test_mcp_sdk_acceptance.py
          "$MCP_SDK_PYTHON" -I scripts/mcp_sdk_acceptance.py "$binary" --out "$RUNNER_TEMP/mcp-sdk-acceptance.json"
      - name: upload official SDK acceptance receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-sdk-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/mcp-sdk-acceptance.json

  installer:
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist
      - name: candidate installer smoke
        if: runner.os != 'Windows'
        shell: bash
        env:
          FITR_BIN: ${{ runner.temp }}/fitr-install
          FITR_RELEASE_BASE_URL: http://127.0.0.1:8765
          FITR_REQUIRE_BINARY: '1'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/SHA256SUMS >/dev/null && break
            if [ "$attempt" -eq 20 ]; then exit 1; fi
            sleep 0.25
          done
          sh install.sh
          expected="fitr $(tr -d '[:space:]' < internal/buildinfo/version.txt)"
          test "$("$FITR_BIN/fitr" version)" = "$expected"
      - name: candidate installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FITR_BIN: ${{ runner.temp }}\fitr-install
          FITR_RELEASE_BASE_URL: http://127.0.0.1:8765
          FITR_REQUIRE_BINARY: '1'
          FITR_NO_PATH: '1'
        run: |
          $userPathBefore = [Environment]::GetEnvironmentVariable('Path', 'User')
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory','dist' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              try {
                Invoke-WebRequest http://127.0.0.1:8765/SHA256SUMS -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw "candidate server did not become ready" }
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
            if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }
            $expected = "fitr $((Get-Content internal/buildinfo/version.txt -Raw).Trim())"
            $installed = & "$env:FITR_BIN\fitr.exe" version
            if ($installed -ne $expected) { throw "installed $installed, want $expected" }
            $userPathAfter = [Environment]::GetEnvironmentVariable('Path', 'User')
            if ($userPathAfter -cne $userPathBefore) { throw "installer changed the persistent user PATH" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - name: reject a corrupt candidate without replacing the install
        if: runner.os != 'Windows'
        shell: bash
        env:
          FITR_BIN: ${{ runner.temp }}/fitr-install
          FITR_RELEASE_BASE_URL: http://127.0.0.1:8766
          FITR_REQUIRE_BINARY: '1'
        run: |
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          os_name="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch_name="$(uname -m)"
          case "$arch_name" in
            x86_64|amd64) arch_name=amd64 ;;
            aarch64|arm64) arch_name=arm64 ;;
            *) exit 1 ;;
          esac
          case "$os_name" in
            linux) candidate_asset="fitr-linux-$arch_name" ;;
            darwin) candidate_asset="fitr-darwin-$arch_name" ;;
            *) exit 1 ;;
          esac
          before="$(hash_file "$FITR_BIN/fitr")"
          corrupt="${RUNNER_TEMP}/corrupt-candidate"
          mkdir "$corrupt"
          cp -R dist/. "$corrupt/"
          printf 'corrupt' >> "$corrupt/$candidate_asset"
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$corrupt" >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8766/SHA256SUMS >/dev/null && break
            if [ "$attempt" -eq 20 ]; then exit 1; fi
            sleep 0.25
          done
          set +e
          sh install.sh
          status=$?
          set -e
          test "$status" -ne 0
          after="$(hash_file "$FITR_BIN/fitr")"
          test "$after" = "$before"
      - name: reject a corrupt candidate without replacing the Windows install
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FITR_BIN: ${{ runner.temp }}\fitr-install
          FITR_RELEASE_BASE_URL: http://127.0.0.1:8766
          FITR_REQUIRE_BINARY: '1'
        run: |
          $before = (Get-FileHash "$env:FITR_BIN\fitr.exe" -Algorithm SHA256).Hash
          $corrupt = Join-Path $env:RUNNER_TEMP "corrupt-candidate"
          New-Item -ItemType Directory -Path $corrupt | Out-Null
          Copy-Item -Path "dist\*" -Destination $corrupt -Recurse
          $archName = "amd64"
          if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64" -or $env:PROCESSOR_ARCHITEW6432 -eq "ARM64") {
            $archName = "arm64"
          }
          $asset = Join-Path $corrupt "fitr-windows-$archName.exe"
          [IO.File]::AppendAllText($asset, "corrupt", [Text.Encoding]::ASCII)
          $server = Start-Process python -ArgumentList '-m','http.server','8766','--bind','127.0.0.1','--directory',$corrupt -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              try {
                Invoke-WebRequest http://127.0.0.1:8766/SHA256SUMS -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw "corrupt candidate server did not become ready" }
            $installer = Start-Process powershell.exe `
              -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',(Resolve-Path .\install.ps1).Path `
              -Wait -PassThru -WindowStyle Hidden
            $installerStatus = $installer.ExitCode
            if ($installerStatus -eq 0) { throw "corrupt candidate was accepted" }
            $after = (Get-FileHash "$env:FITR_BIN\fitr.exe" -Algorithm SHA256).Hash
            if ($after -cne $before) { throw "corrupt candidate replaced the existing install" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.0' }
      - name: reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: terminal renderer fuzz smoke
        run: go test ./internal/top -run='^$' -fuzz=FuzzRenderBounds -fuzztime=20000x -parallel=4
      - name: result decoder fuzz smoke
        run: go test ./internal/record -run='^$' -fuzz=FuzzDecodeRecord -fuzztime=20000x -parallel=4
      - name: strict JSON fuzz smoke
        run: go test ./internal/strictjson -run='^$' -fuzz=FuzzValidate -fuzztime=20000x -parallel=4
      - name: GGUF metadata fuzz smoke
        run: go test ./internal/advise -run='^$' -fuzz=FuzzReadMetadata -fuzztime=20000x -parallel=4
      - name: user task file fuzz smoke
        run: go test ./internal/eval -run='^$' -fuzz=FuzzUserCheck -fuzztime=20000x -parallel=4
      - name: conversion lineage fuzz smoke
        run: go test ./internal/calibration -run='^$' -fuzz=FuzzConversionManifest -fuzztime=20000x -parallel=4
      - name: validated-work bundle fuzz smoke
        run: go test ./internal/workload -run='^$' -fuzz=FuzzDecodeBundle -fuzztime=20000x -parallel=4
      - name: discovery inbox fuzz smoke
        run: go test ./internal/discovery -run='^$' -fuzz=FuzzDecodeIdea -fuzztime=20000x -parallel=4
      - name: confirmation bundle fuzz smoke
        run: go test ./internal/experiment -run='^$' -fuzz=FuzzDecodeConfirmationBundle -fuzztime=20000x -parallel=4
      - name: context bundle fuzz smoke
        run: go test ./internal/experiment -run='^$' -fuzz=FuzzDecodeContextBundle -fuzztime=20000x -parallel=4

      - name: static analysis
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: file length gate
        shell: bash
        run: |
          # No style guide sets a number, so this is the Go standard library's
          # own 95th percentile, measured over its 4,816 non-test files. It
          # fires on genuine outliers, not on ordinary large files.
          #
          # Test files are excluded: a table of cases is not the same kind of
          # object as a thousand lines of control flow, and splitting one for a
          # line count moves fixtures away from the assertions that use them.
          max=1600
          fail=0
          while read -r n f; do
            [ "$n" -le "$max" ] && continue
            echo "$f: $n lines exceeds the $max-line gate" >&2
            fail=1
          done < <(git ls-files '*.go' | grep -v '_test\.go$' | xargs wc -l | grep -v ' total$')
          exit $fail

  ci:
    if: always()
    needs: [test, dist, coverage, compatibility, mcp-sdk, installer, security]
    runs-on: ubuntu-latest
    steps:
      - name: require every CI gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          test "$(jq -r '[.[] | select(.result != "success")] | length' <<<"$NEEDS_JSON")" -eq 0
