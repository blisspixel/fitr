name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.25' }
      # No Ollama needed: every test here is pure logic. The tests that would
      # need a model are the ones you run locally against your own hardware.
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: race detector
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1
      - run: go build ./...
      - name: installer syntax
        if: runner.os == 'Linux'
        run: sh -n install.sh
      - name: installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: installer smoke
        if: runner.os != 'Windows'
        shell: bash
        env:
          FITR_BIN: ${{ runner.temp }}/fitr-install
        run: |
          sh install.sh
          "$FITR_BIN/fitr" version | grep -Eq '^fitr [0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'
      - name: installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FITR_BIN: ${{ runner.temp }}\fitr-install
        run: |
          & .\install.ps1
          $installedVersion = & "$env:FITR_BIN\fitr.exe" version
          if ($installedVersion -notmatch '^fitr [0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$') {
            throw "installed binary version is invalid: $installedVersion"
          }

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.25' }
      - run: make dist
      - name: reproducible Linux binary
        shell: bash
        run: |
          go build -trimpath -ldflags="-s -w" -o "${RUNNER_TEMP}/fitr-linux-amd64" ./cmd/fitr
          cmp dist/fitr-linux-amd64 "${RUNNER_TEMP}/fitr-linux-amd64"
      - name: binary CLI contract
        shell: bash
        run: |
          ./dist/fitr-linux-amd64 --help >/dev/null 2>&1
          ./dist/fitr-linux-amd64 run --help >/dev/null 2>&1
          set +e
          diagnostic="$(./dist/fitr-linux-amd64 device unexpected 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "hint: fitr device" <<<"$diagnostic"
      - name: binary size gate
        shell: bash
        run: |
          max_bytes=12000000
          for binary in dist/fitr-*; do
            size="$(stat -c %s "$binary")"
            printf '%-32s %10d bytes\n' "$binary" "$size"
            test "$size" -le "$max_bytes"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: dist/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.25' }
      - name: reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: terminal renderer fuzz smoke
        run: go test ./internal/top -run='^$' -fuzz=FuzzRenderBounds -fuzztime=10s
      - name: result decoder fuzz smoke
        run: go test ./internal/record -run='^$' -fuzz=FuzzDecodeRecord -fuzztime=10s
