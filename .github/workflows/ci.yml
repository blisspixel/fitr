name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      # No Ollama needed: every test here is pure logic. The tests that would
      # need a model are the ones you run locally against your own hardware.
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build ./...

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
