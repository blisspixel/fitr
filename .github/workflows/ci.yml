name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

# Job budgets from ten successful push runs, 39259907641 (2026-10-19)
# through 44020392877 (2026-11-17). The longest job was test on
# ubuntu-latest, 4.88 minutes, on 43946630808. Most of that job was the
# race detector, 210 seconds on that run. setup-go on the sampled Linux
# jobs stayed between 8 and 13 seconds. Those runs were not labeled as a
# cold cache or a warm cache, so these limits are headroom over the
# observed successful maximum, not a cold-start distribution.
# test is 30 minutes, about six times 4.88. Every other measured job
# finished in at most 2.40 minutes (dist, on 42547976822), and those
# jobs are 15 minutes. mcp-sdk was already 15. The aggregate is 10
# minutes: before it checked out the gate script it finished in at most
# 0.07 minutes.
# A timeout, a skip, or a missing result fails the aggregate. That is an
# incomplete gate, not a product measurement and not a runtime
# qualification. Fuzz targets stay at 20000 iterations. Go's default test
# timeout stays in place. No concurrency cancellation was added.
# A failed unit or race run is copied to a 14-day artifact. That log is
# the test report from this pure-logic job. Installer fixture logs use
# the same retention. Fuzz and lint output stays in the job log.
# Hosted Ubuntu jobs pin ubuntu-26.04. Checked against
# actions/runner-images Ubuntu2604-Readme.md on 2026-11-17: image
# 20261111.196.1, OS 26.04.1 LTS. The floating label was moving from
# 24.04 to 26.04 through 2026-11-19. Go 1.27.4, the reference Python
# lines, and the MCP SDK Python are installed by their setup actions.
# make, bash, jq, gcc, and the installer fixture's python3 come from
# the image. The release binary stays CGO_ENABLED=0, so this pin is
# not a glibc floor. The race detector uses the image C compiler.
# macOS and Windows keep their floating latest labels.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI gate result cases
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check-ci-needs_test.sh
      - name: Ubuntu runner image pin
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check-runner-image_test.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.4' }
      # No Ollama needed: every test here is pure logic. The tests that would
      # need a model are the ones you run locally against your own hardware.
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      - name: unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/fitr-test-logs"
          go test ./... -count=1 2>&1 | tee "$RUNNER_TEMP/fitr-test-logs/unit.log"
      - name: race detector
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/fitr-test-logs"
          go test -race ./... -count=1 2>&1 | tee "$RUNNER_TEMP/fitr-test-logs/race.log"
      - run: go build ./...
      - name: README screenshot drift
        if: runner.os == 'Linux'
        run: |
          go run ./cmd/fitr screenshots docs/assets
          git diff --exit-code -- docs/assets
      - name: installer syntax
        if: runner.os == 'Linux'
        run: sh -n install.sh
      - name: installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: installer failure stays in the PowerShell host
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FITR_BIN: ${{ runner.temp }}\fitr-failure-scope
          FITR_RELEASE_BASE_URL: http://127.0.0.1:1
          FITR_REQUIRE_BINARY: '1'
        run: |
          $preferenceBefore = $ErrorActionPreference
          $caught = $false
          try {
            Invoke-Expression (Get-Content .\install.ps1 -Raw)
          } catch {
            $caught = $true
            if (-not $_.Exception.Message.Contains("could not fetch the required release binary")) {
              throw
            }
          }
          if (-not $caught) { throw "installer failure was not a terminating exception" }
          if ($ErrorActionPreference -ne $preferenceBefore) {
            throw "installer changed caller ErrorActionPreference from $preferenceBefore to $ErrorActionPreference"
          }
      # Kept only when an earlier step failed. A hung package still ends on
      # Go's default timeout, so this step can run. The log is the test
      # report, not a model transcript.
      - name: retain test logs when the job fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-log-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fitr-test-logs
          retention-days: 14
          if-no-files-found: ignore
  dist:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.4' }
      - run: make dist
      # Deterministic, not reproducible. This rebuilds the same target in the
      # same job, on the same runner, from the same checkout and toolchain, so
      # it catches a build that varies run to run. It does not establish that an
      # independent party can recreate these bytes: -buildvcs is left on, so a
      # build from a source tarball with no .git carries different stamping.
      - name: deterministic Linux rebuild
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "${RUNNER_TEMP}/fitr-linux-amd64" ./cmd/fitr
          cmp dist/fitr-linux-amd64 "${RUNNER_TEMP}/fitr-linux-amd64"
      - name: static Linux binary
        shell: bash
        run: |
          if readelf -l dist/fitr-linux-amd64 | grep -q 'Requesting program interpreter'; then
            echo "Linux release binary has a dynamic loader" >&2
            exit 1
          fi
      - name: binary CLI contract
        shell: bash
        run: |
          ./dist/fitr-linux-amd64 --help >/dev/null 2>&1
          ./dist/fitr-linux-amd64 run --help >/dev/null 2>&1
          set +e
          diagnostic="$(./dist/fitr-linux-amd64 device unexpected 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "hint: fitr device" <<<"$diagnostic"
      # Copies the built binary's embedded plugin into a temp directory and
      # reads desktop status from an empty results directory. This is not
      # Omarchy shell acceptance: no Quickshell, no panel, and no serving runtime.
      - name: built binary desktop plugin install
        shell: bash
        run: sh scripts/check-desktop-plugin.sh dist/fitr-linux-amd64
      - name: binary size gate
        run: sh scripts/check-binary-size.sh dist
      - name: checksums
        run: make dist-checksums
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: dist/

  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.4' }
      - name: repository coverage gate
        run: sh scripts/check-coverage.sh 80

  # Newest patch of each maintained line. 3.11.17, 3.12.15, 3.13.16 and
  # 3.14.8 are the 2026-10-01 security releases. 3.15.0 final shipped
  # 2026-10-09. 3.10 reached end of life on 2026-10-01. python-version
  # stays a block mapping. A one-line flow mapping around the matrix
  # expression is rejected as invalid workflow YAML before any job starts.
  reference-python:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.17", "3.12.15", "3.13.16", "3.14.8", "3.15.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: reference logic tests
        working-directory: reference-python
        run: |
          python -m pip install --disable-pip-version-check "pytest>=7.4" "rich>=13.3.3,!=14.0.0"
          python -m pytest tests -q

  mcp-sdk:
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.4' }
      # cp315 wheels. pydantic 2.14.1 requires pydantic-core 2.50.1, which
      # publishes a CPython 3.15 build. Checked on PyPI 2026-10-19. 3.15.0
      # is the current 3.15 release, same pin as reference-python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist
      - name: install locked test-only SDK
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/fitr-mcp-sdk"
          sdk_python="$RUNNER_TEMP/fitr-mcp-sdk/bin/python"
          if [ "$RUNNER_OS" = "Windows" ]; then
            sdk_python="$RUNNER_TEMP/fitr-mcp-sdk/Scripts/python.exe"
          fi
          "$sdk_python" -I -m pip install --require-hashes -r scripts/mcp-sdk-requirements.txt
          "$sdk_python" -I -m pip check
          printf 'MCP_SDK_PYTHON=%s\n' "$sdk_python" >> "$GITHUB_ENV"
      - name: official SDK accepts actual candidate binary
        shell: bash
        run: |
          binary="$(pwd)/dist/fitr-$(go env GOOS)-$(go env GOARCH)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            binary="$binary.exe"
          fi
          chmod +x "$binary"
          "$MCP_SDK_PYTHON" -I -B -m unittest discover -s scripts -p test_mcp_sdk_acceptance.py
          "$MCP_SDK_PYTHON" -I scripts/mcp_sdk_acceptance.py "$binary" --out "$RUNNER_TEMP/mcp-sdk-acceptance.json"
      - name: upload official SDK acceptance receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-sdk-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/mcp-sdk-acceptance.json

  installer:
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist
      - name: installer fixture regressions
        shell: bash
        run: python -I -B -m unittest discover -s scripts -p test_installer_fixture.py
      - name: candidate installer smoke
        if: runner.os != 'Windows'
        shell: bash
        env:
          FITR_BIN: ${{ runner.temp }}/fitr-install
          FITR_REQUIRE_BINARY: '1'
        run: |
          python3 scripts/installer_fixture.py --directory dist --log "$RUNNER_TEMP/installer-valid-server.log" -- sh install.sh
          expected="fitr $(tr -d '[:space:]' < internal/buildinfo/version.txt)"
          test "$("$FITR_BIN/fitr" version)" = "$expected"
      - name: candidate installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FITR_BIN: ${{ runner.temp }}\fitr-install
          FITR_REQUIRE_BINARY: '1'
          FITR_NO_PATH: '1'
        run: |
          $userPathBefore = [Environment]::GetEnvironmentVariable('Path', 'User')
          & python scripts/installer_fixture.py --directory dist --log "$env:RUNNER_TEMP\installer-valid-server.log" -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }
          $expected = "fitr $((Get-Content internal/buildinfo/version.txt -Raw).Trim())"
          $installed = & "$env:FITR_BIN\fitr.exe" version
          if ($installed -ne $expected) { throw "installed $installed, want $expected" }
          $userPathAfter = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPathAfter -cne $userPathBefore) { throw "installer changed the persistent user PATH" }
      - name: reject a corrupt candidate without replacing the install
        if: runner.os != 'Windows'
        shell: bash
        env:
          FITR_BIN: ${{ runner.temp }}/fitr-install
          FITR_REQUIRE_BINARY: '1'
        run: |
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          os_name="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch_name="$(uname -m)"
          case "$arch_name" in
            x86_64|amd64) arch_name=amd64 ;;
            aarch64|arm64) arch_name=arm64 ;;
            *) exit 1 ;;
          esac
          case "$os_name" in
            linux) candidate_asset="fitr-linux-$arch_name" ;;
            darwin) candidate_asset="fitr-darwin-$arch_name" ;;
            *) exit 1 ;;
          esac
          before="$(hash_file "$FITR_BIN/fitr")"
          corrupt="${RUNNER_TEMP}/corrupt-candidate"
          mkdir "$corrupt"
          cp -R dist/. "$corrupt/"
          printf 'corrupt' >> "$corrupt/$candidate_asset"
          set +e
          python3 scripts/installer_fixture.py --directory "$corrupt" --log "$RUNNER_TEMP/installer-corrupt-server.log" -- sh install.sh
          status=$?
          set -e
          test "$status" -eq 1
          after="$(hash_file "$FITR_BIN/fitr")"
          test "$after" = "$before"
      - name: reject a corrupt candidate without replacing the Windows install
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FITR_BIN: ${{ runner.temp }}\fitr-install
          FITR_REQUIRE_BINARY: '1'
        run: |
          $before = (Get-FileHash "$env:FITR_BIN\fitr.exe" -Algorithm SHA256).Hash
          $corrupt = Join-Path $env:RUNNER_TEMP "corrupt-candidate"
          New-Item -ItemType Directory -Path $corrupt | Out-Null
          Copy-Item -Path "dist\*" -Destination $corrupt -Recurse
          $archName = "amd64"
          if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64" -or $env:PROCESSOR_ARCHITEW6432 -eq "ARM64") {
            $archName = "arm64"
          }
          $asset = Join-Path $corrupt "fitr-windows-$archName.exe"
          [IO.File]::AppendAllText($asset, "corrupt", [Text.Encoding]::ASCII)
          $installer = Start-Process python `
            -ArgumentList 'scripts/installer_fixture.py','--directory',$corrupt,'--log',"$env:RUNNER_TEMP\installer-corrupt-server.log",'--','powershell.exe','-NoProfile','-ExecutionPolicy','Bypass','-File',(Resolve-Path .\install.ps1).Path `
            -Wait -PassThru -NoNewWindow
          $installerStatus = $installer.ExitCode
          if ($installerStatus -ne 1) { throw "corrupt candidate installer exited $installerStatus, want 1" }
          $after = (Get-FileHash "$env:FITR_BIN\fitr.exe" -Algorithm SHA256).Hash
          if ($after -cne $before) { throw "corrupt candidate replaced the existing install" }

      - name: upload installer fixture server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-server-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/installer-*-server.log
          retention-days: 14

  security:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.4' }
      - name: reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: terminal renderer fuzz smoke
        run: go test ./internal/top -run='^$' -fuzz=FuzzRenderBounds -fuzztime=20000x -parallel=4
      - name: result decoder fuzz smoke
        run: go test ./internal/record -run='^$' -fuzz=FuzzDecodeRecord -fuzztime=20000x -parallel=4
      - name: strict JSON fuzz smoke
        run: go test ./internal/strictjson -run='^$' -fuzz=FuzzValidate -fuzztime=20000x -parallel=4
      - name: GGUF metadata fuzz smoke
        run: go test ./internal/advise -run='^$' -fuzz=FuzzReadMetadata -fuzztime=20000x -parallel=4
      - name: source publisher metadata fuzz smoke
        run: go test ./internal/source -run='^$' -fuzz=FuzzPublisherMetadata -fuzztime=20000x -parallel=4
      - name: source prefix range fuzz smoke
        run: go test ./internal/source -run='^$' -fuzz=FuzzPrefixRange -fuzztime=20000x -parallel=4
      - name: user task file fuzz smoke
        run: go test ./internal/eval -run='^$' -fuzz=FuzzUserCheck -fuzztime=20000x -parallel=4
      - name: conversion lineage fuzz smoke
        run: go test ./internal/calibration -run='^$' -fuzz=FuzzConversionManifest -fuzztime=20000x -parallel=4
      - name: validated-work bundle fuzz smoke
        run: go test ./internal/workload -run='^$' -fuzz=FuzzDecodeBundle -fuzztime=20000x -parallel=4
      - name: discovery inbox fuzz smoke
        run: go test ./internal/discovery -run='^$' -fuzz=FuzzDecodeIdea -fuzztime=20000x -parallel=4
      - name: confirmation bundle fuzz smoke
        run: go test ./internal/experiment -run='^$' -fuzz=FuzzDecodeConfirmationBundle -fuzztime=20000x -parallel=4
      - name: context bundle fuzz smoke
        run: go test ./internal/experiment -run='^$' -fuzz=FuzzDecodeContextBundle -fuzztime=20000x -parallel=4
      - name: fitting session fuzz smoke
        run: go test ./internal/fitting -run='^$' -fuzz=FuzzDecodeSession -fuzztime=20000x -parallel=4
      - name: external reference verifier fuzz smoke
        run: go test ./internal/reference -run='^$' -fuzz=FuzzDecodeVerifier -fuzztime=20000x -parallel=4
      - name: token condition plan fuzz smoke
        run: go test ./internal/contextquality -run='^$' -fuzz=FuzzDecodeTokenConditionPlan -fuzztime=20000x -parallel=4
      - name: context overflow parser fuzz smoke
        run: go test ./internal/ollama -run='^$' -fuzz=FuzzParseContextOverflow -fuzztime=20000x -parallel=4

      - name: static analysis
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: file length gate
        shell: bash
        run: |
          # No style guide sets a number, so this is the Go standard library's
          # own 95th percentile, measured over its 4,816 non-test files. It
          # fires on genuine outliers, not on ordinary large files.
          #
          # Test files are excluded: a table of cases is not the same kind of
          # object as a thousand lines of control flow, and splitting one for a
          # line count moves fixtures away from the assertions that use them.
          max=1600
          fail=0
          while read -r n f; do
            [ "$n" -le "$max" ] && continue
            echo "$f: $n lines exceeds the $max-line gate" >&2
            fail=1
          done < <(git ls-files '*.go' | grep -v '_test\.go$' | xargs wc -l | grep -v ' total$')
          exit $fail

  ci:
    if: always()
    needs: [test, dist, coverage, reference-python, mcp-sdk, installer, security]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: require every CI gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: printf '%s\n' "$NEEDS_JSON" | sh scripts/check-ci-needs.sh
