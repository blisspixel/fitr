name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.25" }
      - name: verify tag and source version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          source_version="$(tr -d '[:space:]' < internal/buildinfo/version.txt)"
          test "$tag_version" = "$source_version"
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: make dist
      - name: verify binary version
        shell: bash
        run: |
          test "$(./dist/fitr-linux-amd64 version)" = "fitr ${GITHUB_REF_NAME#v}"
      - name: checksums
        run: |
          cd dist
          sha256sum fitr-* > SHA256SUMS
          cat SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "fitr ${{ github.ref_name }}" \
            --generate-notes
