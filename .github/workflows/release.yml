name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.25" }
      - name: verify tag and source version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          source_version="$(tr -d '[:space:]' < internal/buildinfo/version.txt)"
          test "$tag_version" = "$source_version"
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1
      - name: reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: terminal renderer fuzz smoke
        run: go test ./internal/top -run='^$' -fuzz=FuzzRenderBounds -fuzztime=10s
      - name: result decoder fuzz smoke
        run: go test ./internal/record -run='^$' -fuzz=FuzzDecodeRecord -fuzztime=10s
      - run: make dist
      - name: reproducible Linux binary
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "${RUNNER_TEMP}/fitr-linux-amd64" ./cmd/fitr
          cmp dist/fitr-linux-amd64 "${RUNNER_TEMP}/fitr-linux-amd64"
      - name: static Linux binary
        shell: bash
        run: |
          if readelf -l dist/fitr-linux-amd64 | grep -q 'Requesting program interpreter'; then
            echo "Linux release binary has a dynamic loader" >&2
            exit 1
          fi
      - name: binary size gate
        shell: bash
        run: |
          max_bytes=12000000
          for binary in dist/fitr-*; do
            size="$(stat -c %s "$binary")"
            printf '%-32s %10d bytes\n' "$binary" "$size"
            test "$size" -le "$max_bytes"
          done
      - name: verify binary version
        shell: bash
        run: |
          test "$(./dist/fitr-linux-amd64 version)" = "fitr ${GITHUB_REF_NAME#v}"
      - name: binary CLI contract
        shell: bash
        run: |
          ./dist/fitr-linux-amd64 --help >/dev/null 2>&1
          ./dist/fitr-linux-amd64 run --help >/dev/null 2>&1
          set +e
          diagnostic="$(./dist/fitr-linux-amd64 device unexpected 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "hint: fitr device" <<<"$diagnostic"
      - name: checksums
        shell: bash
        run: |
          cd dist
          sha256sum fitr-* LICENSE NOTICE THIRD_PARTY_NOTICES.md > SHA256SUMS
          assets=(
            fitr-linux-amd64
            fitr-linux-arm64
            fitr-darwin-amd64
            fitr-darwin-arm64
            fitr-windows-amd64.exe
            fitr-windows-arm64.exe
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.md
          )
          test "$(wc -l < SHA256SUMS | tr -d ' ')" -eq "${#assets[@]}"
          for asset in "${assets[@]}"; do
            count="$(awk -v asset="$asset" '
              {
                file = $2
                sub(/^\*/, "", file)
                if (file == asset) count++
              }
              END { print count + 0 }
            ' SHA256SUMS)"
            test "$count" -eq 1
          done
          cat SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "fitr ${{ github.ref_name }}" \
            --generate-notes
