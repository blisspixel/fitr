name: release
on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.0" }
      - name: verify tag and source version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          source_version="$(tr -d '[:space:]' < internal/buildinfo/version.txt)"
          test "$tag_version" = "$source_version"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
      - name: require passing main CI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          passing_runs="$(
            gh api --method GET "repos/${GH_REPO}/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -f head_sha="${GITHUB_SHA}" \
              -f per_page=100 \
              --jq '.total_count'
          )"
          test "$passing_runs" -ge 1
      - name: require passing native acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          passing_runs="$(
            gh api --method GET "repos/${GH_REPO}/actions/workflows/native-acceptance.yml/runs" \
              -f branch=main \
              -f event=workflow_dispatch \
              -f status=success \
              -f head_sha="${GITHUB_SHA}" \
              -f per_page=100 \
              --jq '.total_count'
          )"
          test "$passing_runs" -ge 1
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: sh scripts/check-coverage.sh 80
      - run: go test -race ./... -count=1
      - name: reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: terminal renderer fuzz smoke
        run: go test ./internal/top -run='^$' -fuzz=FuzzRenderBounds -fuzztime=20000x -parallel=4
      - name: result decoder fuzz smoke
        run: go test ./internal/record -run='^$' -fuzz=FuzzDecodeRecord -fuzztime=20000x -parallel=4
      - name: strict JSON fuzz smoke
        run: go test ./internal/strictjson -run='^$' -fuzz=FuzzValidate -fuzztime=20000x -parallel=4
      - name: GGUF metadata fuzz smoke
        run: go test ./internal/advise -run='^$' -fuzz=FuzzReadMetadata -fuzztime=20000x -parallel=4
      - name: user task file fuzz smoke
        run: go test ./internal/eval -run='^$' -fuzz=FuzzUserCheck -fuzztime=20000x -parallel=4
      - name: conversion lineage fuzz smoke
        run: go test ./internal/calibration -run='^$' -fuzz=FuzzConversionManifest -fuzztime=20000x -parallel=4
      - name: validated-work bundle fuzz smoke
        run: go test ./internal/workload -run='^$' -fuzz=FuzzDecodeBundle -fuzztime=20000x -parallel=4
      - name: discovery inbox fuzz smoke
        run: go test ./internal/discovery -run='^$' -fuzz=FuzzDecodeIdea -fuzztime=20000x -parallel=4
      - name: confirmation bundle fuzz smoke
        run: go test ./internal/experiment -run='^$' -fuzz=FuzzDecodeConfirmationBundle -fuzztime=20000x -parallel=4
      - name: context bundle fuzz smoke
        run: go test ./internal/experiment -run='^$' -fuzz=FuzzDecodeContextBundle -fuzztime=20000x -parallel=4
      - name: static analysis
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: file length gate
        shell: bash
        run: |
          max=1600
          fail=0
          while read -r n f; do
            [ "$n" -le "$max" ] && continue
            echo "$f: $n lines exceeds the $max-line gate" >&2
            fail=1
          done < <(git ls-files '*.go' | grep -v '_test\.go$' | xargs wc -l | grep -v ' total$')
          exit $fail
      - run: make dist
      - name: reproducible Linux binary
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "${RUNNER_TEMP}/fitr-linux-amd64" ./cmd/fitr
          cmp dist/fitr-linux-amd64 "${RUNNER_TEMP}/fitr-linux-amd64"
      - name: static Linux binary
        shell: bash
        run: |
          if readelf -l dist/fitr-linux-amd64 | grep -q 'Requesting program interpreter'; then
            echo "Linux release binary has a dynamic loader" >&2
            exit 1
          fi
      - name: binary size gate
        shell: bash
        run: |
          # The context task pack is reachable from record evidence validation,
          # so its generator and verifier are linked rather than eliminated.
          # That is 127 KiB across every target. Measured 15,239,680 bytes on
          # windows/amd64; all six targets retain this measured cap.
          max_bytes=15290000
          for binary in dist/fitr-*; do
            size="$(stat -c %s "$binary")"
            printf '%-32s %10d bytes\n' "$binary" "$size"
            test "$size" -le "$max_bytes"
          done
      - name: verify binary and CLI contract
        shell: bash
        run: |
          test "$(./dist/fitr-linux-amd64 version)" = "fitr ${GITHUB_REF_NAME#v}"
          ./dist/fitr-linux-amd64 --help >/dev/null 2>&1
          ./dist/fitr-linux-amd64 run --help >/dev/null 2>&1
          set +e
          diagnostic="$(./dist/fitr-linux-amd64 device unexpected 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "hint: fitr device" <<<"$diagnostic"
      - name: checksums
        run: make dist-checksums
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: dist/

  installer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: dist
      - name: install candidate
        if: runner.os != 'Windows'
        shell: bash
        env:
          FITR_BIN: ${{ runner.temp }}/fitr-install
          FITR_RELEASE_BASE_URL: http://127.0.0.1:8765
          FITR_REQUIRE_BINARY: '1'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/SHA256SUMS >/dev/null && break
            if [ "$attempt" -eq 20 ]; then exit 1; fi
            sleep 0.25
          done
          sh install.sh
          test "$("$FITR_BIN/fitr" version)" = "fitr ${GITHUB_REF_NAME#v}"
      - name: install candidate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FITR_BIN: ${{ runner.temp }}\fitr-install
          FITR_RELEASE_BASE_URL: http://127.0.0.1:8765
          FITR_REQUIRE_BINARY: '1'
          FITR_NO_PATH: '1'
        run: |
          $userPathBefore = [Environment]::GetEnvironmentVariable('Path', 'User')
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory','dist' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              try {
                Invoke-WebRequest http://127.0.0.1:8765/SHA256SUMS -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw "candidate server did not become ready" }
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
            if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }
            $installed = & "$env:FITR_BIN\fitr.exe" version
            if ($installed -ne "fitr $($env:GITHUB_REF_NAME.Substring(1))") {
              throw "installed $installed from candidate"
            }
            $userPathAfter = [Environment]::GetEnvironmentVariable('Path', 'User')
            if ($userPathAfter -cne $userPathBefore) { throw "installer changed the persistent user PATH" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  publish:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: dist
      - name: verify every release asset
        shell: bash
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          assets=(
            fitr-linux-amd64
            fitr-linux-arm64
            fitr-darwin-amd64
            fitr-darwin-arm64
            fitr-windows-amd64.exe
            fitr-windows-arm64.exe
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.md
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
      - name: publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)"
            test "$draft" = "true"
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --draft \
              --title "fitr ${GITHUB_REF_NAME}" \
              --generate-notes \
              "${release_flags[@]}"
          fi
          published="${RUNNER_TEMP}/published-release"
          mkdir "$published"
          gh release download "${GITHUB_REF_NAME}" --dir "$published"
          test "$(find "$published" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 10
          (cd "$published" && sha256sum --check SHA256SUMS)
          gh release edit "${GITHUB_REF_NAME}" --draft=false
