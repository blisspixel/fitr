name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.25" }
      - name: verify tag and source version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          source_version="$(tr -d '[:space:]' < internal/buildinfo/version.txt)"
          test "$tag_version" = "$source_version"
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1
      - name: reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: terminal renderer fuzz smoke
        run: go test ./internal/top -run='^$' -fuzz=FuzzRenderBounds -fuzztime=10s
      - name: result decoder fuzz smoke
        run: go test ./internal/record -run='^$' -fuzz=FuzzDecodeRecord -fuzztime=10s
      - run: make dist
      - name: binary size gate
        shell: bash
        run: |
          max_bytes=12000000
          for binary in dist/fitr-*; do
            size="$(stat -c %s "$binary")"
            printf '%-32s %10d bytes\n' "$binary" "$size"
            test "$size" -le "$max_bytes"
          done
      - name: verify binary version
        shell: bash
        run: |
          test "$(./dist/fitr-linux-amd64 version)" = "fitr ${GITHUB_REF_NAME#v}"
      - name: binary CLI contract
        shell: bash
        run: |
          ./dist/fitr-linux-amd64 --help >/dev/null 2>&1
          ./dist/fitr-linux-amd64 run --help >/dev/null 2>&1
          set +e
          diagnostic="$(./dist/fitr-linux-amd64 device unexpected 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "hint: fitr device" <<<"$diagnostic"
      - name: checksums
        run: |
          cd dist
          sha256sum fitr-* LICENSE THIRD_PARTY_NOTICES.md > SHA256SUMS
          cat SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "fitr ${{ github.ref_name }}" \
            --generate-notes
