[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit-local"
version = "0.1.0"
description = "Is this local model any good ON THIS DEVICE? Device-aware, needs-based evaluation for Ollama models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "eval", "benchmark", "ollama", "local-llm", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Rich only, deliberately no Textual: Inspect AI spent ~18 months fighting
  # Textual major-version churn and still carries dual-API branches. Rich gets
  # most of the value for a fraction of the maintenance surface.
  "rich>=13.3.3,!=14.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
evalkit = "cli:main"

[project.urls]
Homepage = "https://github.com/blisspixel/evalkit"
Issues = "https://github.com/blisspixel/evalkit/issues"

[tool.setuptools]
py-modules = ["cli", "runner", "device", "score", "stats", "display", "board",
              "diag_tools", "tasks_core", "tasks_agentic", "tasks_memory"]

[tool.setuptools.package-data]
"*" = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
